    <!-- splash:fin -->
    <script>
      // Applique le thème choisi avant le premier rendu, pour éviter un flash.
      try {
        var theme = localStorage.getItem("viktus:theme");
        if (theme === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#f6f4f8";
        }
      } catch (_) {}
    </script>
